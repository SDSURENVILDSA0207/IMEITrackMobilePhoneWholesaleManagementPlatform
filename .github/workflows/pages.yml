name: Deploy Web To GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build web app
        env:
          # Example: owner/repo -> /repo/
          VITE_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
          # Configure this in GitHub: Settings -> Secrets and variables -> Actions -> Variables.
          # Example: https://your-api-host.com/api/v1
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Missing VITE_API_URL. Add repository variable VITE_API_URL with your deployed API base URL (must include /api/v1)." >&2
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm --filter @imeitrack/web build
          cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
